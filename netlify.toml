# Netlify build configuration for Predik.
#
# Netlify detects Next.js here and provisions the OpenNext adapter itself — that
# adapter serves server-side rendering, every Route Handler under `app/api/**`
# (including the payment webhook) and the Next.js route cache. Its version is
# deliberately NOT pinned: Netlify keeps it in step with each Next.js release,
# and pinning is the documented way to end up behind on framework support.
#
# Only the build command and the Node major are pinned. Next.js 16 requires
# Node.js >= 20.9; 22 is Netlify's current default and is what this app is
# verified on.
#
# `publish` is intentionally absent: with the Next.js adapter, the publish
# directory is managed by the adapter, not by this file.
#
# ---------------------------------------------------------------------------
# Required site configuration (Site configuration → Environment variables).
# These are secrets/config and must NEVER be committed to this repository:
#
#   DATABASE_URL            PostgreSQL connection string. REQUIRED — nothing
#                           renders without it, and Netlify cannot host a
#                           database, so this points at an external managed
#                           PostgreSQL. On serverless functions use the
#                           provider's POOLED endpoint, not the direct one.
#   DATABASE_SCHEMA_BOOTSTRAP
#                           `auto` on the first deploy (creates the tables and
#                           the append-only ledger triggers), then `off` once
#                           `pnpm db:bootstrap` has run against the database.
#   ADMIN_PHONES            Comma-separated admin phone digits. Without it no
#                           admin can exist (fail-closed).
#   OTP_FIXED_CODE          Sign-in code. In production an unset value makes
#                           sign-in refuse with 503 rather than use the public
#                           demo code.
#   TRUSTED_ORIGINS         The public origin, e.g. https://prediction007.netlify.app
#
# Payment mode defaults to `demo` (simulated) and live money stays DISABLED.
# A production runtime refuses to move balances through a simulated provider
# unless the operator explicitly acknowledges a non-money deployment with
# PAYMENTS_ALLOW_SIMULATED_IN_PRODUCTION=true.
#
# Full reference: env.example and docs/PRODUCTION-RUNBOOK.md
# ---------------------------------------------------------------------------

[build]
  command = "pnpm build"

[build.environment]
  NODE_VERSION = "22"
